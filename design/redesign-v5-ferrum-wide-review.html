<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Tarot Redesign V5.2 — Wider Ferrum Title Proof</title>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/jetbrains-mono-400.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/jetbrains-mono-600.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
    :root { color-scheme: dark; --gold:#c8943d; --muted:#8f7b57; --line:rgba(200,148,61,.25); }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:#050505; color:#e1bd70; font-family:"JetBrains Mono",monospace; }
    header { width:min(1480px,calc(100% - 40px)); margin:auto; padding:70px 0 42px; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0 0 16px; color:var(--gold); font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    h1 { max-width:980px; margin:0; font-size:clamp(2.4rem,7vw,6.4rem); font-weight:400; letter-spacing:-.07em; line-height:.92; }
    .lede { max-width:850px; margin:26px 0 0; color:var(--muted); font-size:13px; line-height:1.8; }
    main { width:min(1480px,calc(100% - 40px)); margin:auto; padding:48px 0 100px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
    figure { margin:0; min-width:0; }
    button { display:block; width:100%; padding:0; border:1px solid var(--line); background:#080806; cursor:zoom-in; box-shadow:0 30px 70px rgba(0,0,0,.55); transition:transform 220ms cubic-bezier(.2,.8,.2,1),border-color 180ms ease; }
    button:hover,button:focus-visible { transform:translateY(-7px); border-color:var(--gold); outline:none; }
    img { display:block; width:100%; height:auto; }
    figcaption { display:grid; gap:7px; padding:15px 2px 0; }
    figcaption span { color:var(--gold); font-size:9px; letter-spacing:.14em; }
    figcaption strong { color:#e1bd70; font-size:12px; font-weight:600; }
    dialog { width:min(92vw,980px); max-height:94vh; padding:0; overflow:auto; border:1px solid var(--gold); background:#050505; box-shadow:0 40px 120px #000; }
    dialog::backdrop { background:rgba(0,0,0,.9); backdrop-filter:blur(8px); }
    dialog img { width:100%; }
    .close { position:fixed; top:18px; right:18px; z-index:2; width:46px; height:46px; border:1px solid var(--gold); background:#050505; color:#e1bd70; cursor:pointer; font-size:22px; }
    @media (max-width:800px) { .grid { grid-template-columns:1fr; gap:48px; } header { padding-top:48px; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Design Gate 05 · V5.2 · Wider title treatment</p>
    <h1>Wider Ferrum proof</h1>
    <p class="lede">The approved simple 2D artwork remains unchanged. The Ferrum-inspired title glyphs are now approximately 25–30% wider on the x-axis, with broader counters and stronger strokes for improved readability.</p>
  </header>
  <main>
    <section class="grid" aria-label="High-resolution tarot redesign proofs">
      <figure>
        <button type="button" data-src="../references/redesign-v5-ferrum-wide-proof/MAJOR-00-THE-FOOL.png" aria-label="Enlarge The Fool"><img src="../references/redesign-v5-ferrum-wide-proof/MAJOR-00-THE-FOOL.png" alt="Simple 2D tarot card The Fool with wider Ferrum title treatment"></button>
        <figcaption><span>MAJOR-00 · 1024×1536</span><strong>The Fool · 愚人</strong></figcaption>
      </figure>
      <figure>
        <button type="button" data-src="../references/redesign-v5-ferrum-wide-proof/MAJOR-18-THE-MOON.png" aria-label="Enlarge The Moon"><img src="../references/redesign-v5-ferrum-wide-proof/MAJOR-18-THE-MOON.png" alt="Simple 2D tarot card The Moon with wider Ferrum title treatment"></button>
        <figcaption><span>MAJOR-18 · 1024×1536</span><strong>The Moon · 月亮</strong></figcaption>
      </figure>
      <figure>
        <button type="button" data-src="../references/redesign-v5-ferrum-wide-proof/SWORDS-03-THREE-OF-SWORDS.png" aria-label="Enlarge Three of Swords"><img src="../references/redesign-v5-ferrum-wide-proof/SWORDS-03-THREE-OF-SWORDS.png" alt="Simple 2D tarot card Three of Swords with wider Ferrum title treatment"></button>
        <figcaption><span>SWORDS-03 · 1024×1536</span><strong>Three of Swords · 宝剑三</strong></figcaption>
      </figure>
    </section>
  </main>
  <dialog id="preview"><button class="close" type="button" aria-label="Close preview">×</button><img alt="Full-resolution tarot preview"></dialog>
  <script>
    const dialog = document.querySelector('#preview');
    const preview = dialog.querySelector('img');
    document.querySelectorAll('[data-src]').forEach((button) => button.addEventListener('click', () => {
      preview.src = button.dataset.src;
      preview.alt = button.querySelector('img').alt;
      dialog.showModal();
    }));
    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
